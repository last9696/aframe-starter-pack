<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sky1" src="assets/sky.png" />
        <img id="bb" src="assets/bb.jpeg" />
        <img id="icecreamcone" src="assets/icecream.jpeg" />
        <img id="icecreamsphere" src="assets/icecreamice.jpeg" />
      </a-assets>
      <a-sphere position="0 1.25 -5" radius="1.25" src="#bb"></a-sphere>
      <a-cone position="3 1.5 -5" radius-bottom="0" radius-top="1" height="3" src="#icecreamcone"></a-cone>
      <a-sphere position="3 3.5 -5" radius="1.1" src="#icecreamsphere"></a-sphere>
      <a-sky src="#sky1" color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
